name: Build & Release (Multi-Arch)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Build standalone Linux binary ───────────────────
  # Build inside Ubuntu 20.04 container so the binary links against glibc 2.31
  # and runs on Ubuntu 20.04+ servers.
  build-binary:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    strategy:
      matrix:
        arch: [amd64, armv7]  # <-- اضافه شدن معماری armv7
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl ca-certificates build-essential zlib1g-dev libssl-dev \
            libffi-dev libbz2-dev libreadline-dev libsqlite3-dev \
            liblzma-dev tk-dev uuid-dev libncurses5-dev gcc-arm-linux-gnueabihf # <-- اضافه شدن کراس-کامپایلر برای ARM
          # Install Node.js 22
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          # Install Python 3.12 from source (20.04 ships 3.8)
          curl -fsSL https://www.python.org/ftp/python/3.12.8/Python-3.12.8.tgz | tar xz
          cd Python-3.12.8
          ./configure --enable-optimizations --enable-shared --prefix=/usr/local \
            LDFLAGS="-Wl,-rpath,/usr/local/lib"
          make -j"$(nproc)"
          make install
          ln -sf /usr/local/bin/python3.12 /usr/local/bin/python3
          ln -sf /usr/local/bin/pip3.12 /usr/local/bin/pip3
          python3 --version
          node --version

      - name: Build release archive
        run: |
          chmod +x scripts/build-linux.sh
          # ارسال معماری به اسکریپت ساخت
          bash scripts/build-linux.sh ${{ matrix.arch }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterDnsWeb-linux-${{ matrix.arch }}
          path: dist/MasterDnsWeb-linux-${{ matrix.arch }}.tar.gz

  # ── Job 2: Create GitHub Release ──────────────────────────
  release:
    needs: [build-binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # دانلود هر دو فایل ساخته شده
      - name: Download amd64 artifact
        uses: actions/download-artifact@v4
        with:
          name: MasterDnsWeb-linux-amd64
          path: ./dist-amd64

      - name: Download armv7 artifact
        uses: actions/download-artifact@v4
        with:
          name: MasterDnsWeb-linux-armv7
          path: ./dist-armv7

      - name: Delete existing release (if re-tagging)
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Recreate tag
        run: |
          git tag -f "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ./dist-amd64/MasterDnsWeb-linux-amd64.tar.gz
            ./dist-armv7/MasterDnsWeb-linux-armv7.tar.gz
